# Netlify: static build, plus one edge function (Markdown for agents). Headers are written to dist/_headers at build.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_FEEDBACK_DISABLED = "true"
  SITE_URL = "https://pavv.dev"

[[redirects]]
  from = "https://myknots.netlify.app/*"
  to = "https://pavv.dev/:splat"
  status = 301
  force = true
